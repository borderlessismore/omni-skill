name: Validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Shared files in sync
        run: python tools/sync_shared.py --check
      - name: Lint skills and manifests
        run: python tools/validate_skills.py
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Example index is valid
        run: python shared/omni_index.py validate examples/omni-index.md
      - name: Evals file parses
        run: python -c "import json; json.load(open('evals/evals.json'))"
